[project]
name = "bgml"
version = "0.1.0"
description = "Blunder Guard ML: human move prediction from Lichess games"
requires-python = ">=3.11"
dependencies = [
    "chess>=1.10",       # python-chess: PGN parsing, legal moves, UCI engines
    "numpy>=1.26",
    "zstandard>=0.22",   # Lichess dumps are .pgn.zst; stream-decompress, never unpack to disk
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# torch is added when training starts, not before: it is ~1 GB and nothing
# in data prep or the baseline needs it.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bgml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
